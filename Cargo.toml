[package]
name = "gpxcat"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive", "unicode"] }
jiff = "0.2"
quick-xml = "0.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49"

[profile.release]
lto = true
codegen-units = 1
strip = true
